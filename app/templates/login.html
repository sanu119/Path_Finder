{% extends 'base.html' %}{% block title %}Log in{% endblock %}{% block content %}<section class="auth-page"><div class="auth-card"><div class="text-center mb-4"><div class="brand justify-content-center mb-3">Pathfinder</div><h2>Welcome back</h2><p class="text-secondary">Continue building your career path.</p></div><form id="loginForm" novalidate><label class="form-label">Email</label><input class="form-control form-control-lg mb-3" type="email" id="email" required autocomplete="email"><label class="form-label">Password</label><input class="form-control form-control-lg mb-3" type="password" id="password" required autocomplete="current-password"><div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Remember me</label></div><button class="btn btn-gradient btn-lg w-100">Log in</button></form><p class="text-center text-secondary mt-4 mb-0">New here? <a href="/register">Create an account</a></p></div></section>{% endblock %}{% block scripts %}<script>document.getElementById('loginForm').addEventListener('submit', async e=>{e.preventDefault(); const r=await api('/api/auth/login','POST',{email:email.value,password:password.value,remember:remember.checked}); if(r.success) location.href='/dashboard';});</script>{% endblock %}
