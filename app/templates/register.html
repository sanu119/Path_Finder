{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<section class="auth-page"><div class="auth-card"><div class="text-center mb-4"><div class="brand justify-content-center mb-3">Pathfinder</div><h2>Create your account</h2><p class="text-secondary">Your roadmap starts with a few details.</p></div><form id="registerForm" novalidate><label class="form-label">Name</label><input class="form-control form-control-lg mb-3" id="name" required><label class="form-label">Email</label><input class="form-control form-control-lg mb-3" type="email" id="email" required><label class="form-label">Password</label><input class="form-control form-control-lg mb-1" type="password" id="password" minlength="8" required><div class="form-text mb-4">At least 8 characters.</div><button class="btn btn-gradient btn-lg w-100">Create account</button></form><p class="text-center text-secondary mt-4 mb-0">Already registered? <a href="/login">Log in</a></p></div></section>{% endblock %}{% block scripts %}<script>document.getElementById('registerForm').addEventListener('submit',async e=>{e.preventDefault();const r=await api('/api/auth/register','POST',{name:name.value,email:email.value,password:password.value});if(r.success)location.href='/onboarding';});</script>{% endblock %}
